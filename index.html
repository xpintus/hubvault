  <body>
    <script>
      (function() {
        var t = localStorage.getItem('hubvault_theme');
        var root = document.documentElement;
        if (t === 'light') { root.classList.add('light'); root.classList.remove('dark'); }
        else { root.classList.add('dark'); root.classList.remove('light'); }
      })();
    </script>
